# Test-only config
# Use in-memory H2 so tests are reproducible and don't require a running MySQL instance.

spring.datasource.url=jdbc:h2:mem:login_test_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT secret for tests (do not use in production)
app.jwt.secret=TEST_TEST_TEST_TEST_TEST_TEST_TEST_TEST_32CHARS
app.jwt.expiration-ms=3600000
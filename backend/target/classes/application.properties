spring.application.name=login-system

spring.datasource.url=jdbc:mysql://localhost:3306/login_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

#hibernate properties -> this will show sql queries on console for easy debugging
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT settings
# - For local dev you can set env var: JWT_SECRET
# - HS256 requires a secret >= 32 characters/bytes
app.jwt.secret=${JWT_SECRET:CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME_32_CHARS}
app.jwt.expiration-ms=86400000












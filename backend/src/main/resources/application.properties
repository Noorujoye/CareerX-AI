spring.application.name=login-system

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/login_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

#hibernate properties -> this will show sql queries on console for easy debugging
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT settings
# - For local dev you can set env var: JWT_SECRET
# - HS256 requires a secret >= 32 characters/bytes
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000


# Gemini (Google AI Studio) for ATS suggestions
# Set env var: GEMINI_API_KEY
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}


# Upload limits (ATS resume uploads)
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB


# this line will say to spring boot to not auto-configure a datasource, which is useful if you want to use a different datasource or manage it manually
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration


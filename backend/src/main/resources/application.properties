spring.application.name=login-system

spring.datasource.url=${DB_URL:jdbc:h2:mem:login_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

#hibernate properties -> this will show sql queries on console for easy debugging
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# JWT settings
# - For local dev you can set env var: JWT_SECRET
# - HS256 requires a secret >= 32 characters/bytes
app.jwt.secret=${JWT_SECRET:CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME_32_CHARS}
app.jwt.expiration-ms=86400000


# Gemini (Google AI Studio) for ATS suggestions
# Set env var: GEMINI_API_KEY
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
app.ats.suggestions.ai-enabled=${ATS_AI_ENABLED:false}
app.guidance.ai-enabled=${GUIDANCE_AI_ENABLED:false}
app.interview.ai-enabled=${INTERVIEW_AI_ENABLED:false}


# Upload limits (ATS resume uploads)
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB


# this line will say to spring boot to not auto-configure a datasource, which is useful if you want to use a different datasource or manage it manually
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

